name: Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The runner image has the Android SDK; AGP fetches any missing platform.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the debug app and run lint
        run: ./gradlew assembleDebug lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pressbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
